version: '3.8'

services:
  web:
    build: .
    container_name: office_supplies_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=office_supplies.settings
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: office_supplies_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=office_supplies
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"

volumes:
  static_volume:
  media_volume:
  postgres_data: