{% extends 'shop/base.html' %}

{% block title %}Личный кабинет{% endblock %}

{% block content %}
    <div style="background: white; border-radius: 10px; padding: 20px;">
        <h2>Личный кабинет</h2>
        
        <div style="margin-top: 30px;">
            <h3>Поиск заказа по номеру</h3>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="order-number" placeholder="Введите номер заказа" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <button onclick="searchOrder()" class="btn" style="width: auto;">Найти заказ</button>
            </div>
        </div>
        
        <div id="order-info" style="margin-top: 30px; display: none;">
            <h3>Информация о заказе</h3>
            <div id="order-details"></div>
        </div>
        
        <div id="no-order" style="margin-top: 30px; display: none; color: #666; text-align: center;">
            Заказ не найден. Проверьте номер заказа.
        </div>
    </div>
    
    <style>
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-confirmed { background: #dbeafe; color: #1e40af; }
        .status-shipped { background: #d1fae5; color: #065f46; }
        .status-delivered { background: #a7f3d0; color: #064e3b; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .timeline {
            position: relative;
            padding-left: 30px;
            margin-top: 20px;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
            border-left: 2px solid #e5e7eb;
            padding-left: 20px;
            margin-left: 10px;
        }
        .timeline-item::before {
            content: "●";
            position: absolute;
            left: -8px;
            top: 0;
            color: #667eea;
            font-size: 14px;
        }
        .timeline-item.active::before {
            color: #10b981;
            font-size: 16px;
        }
        .timeline-date {
            font-size: 12px;
            color: #6b7280;
        }
        .timeline-title {
            font-weight: bold;
            margin: 5px 0;
        }
    </style>
{% endblock %}

{% block extra_js %}
<script>
    async function searchOrder() {
        const orderId = document.getElementById('order-number').value;
        
        if (!orderId) {
            showNotification('Введите номер заказа');
            return;
        }
        
        try {
            const response = await fetch(`/api/orders/${orderId}/`);
            const order = await response.json();
            
            if (response.ok) {
                displayOrder(order);
            } else {
                document.getElementById('order-info').style.display = 'none';
                document.getElementById('no-order').style.display = 'block';
            }
        } catch (error) {
            document.getElementById('order-info').style.display = 'none';
            document.getElementById('no-order').style.display = 'block';
        }
    }
    
    function getStatusText(status) {
        const statuses = {
            'pending': 'В обработке',
            'confirmed': 'Подтвержден',
            'shipped': 'Отправлен',
            'delivered': 'Доставлен',
            'cancelled': 'Отменен'
        };
        return statuses[status] || status;
    }
    
    function getStatusClass(status) {
        return `status-${status}`;
    }
    
    function displayOrder(order) {
        const statusText = getStatusText(order.status);
        const statusClass = getStatusClass(order.status);
        
        let itemsHtml = '<table style="width: 100%; border-collapse: collapse; margin-top: 15px;">';
        itemsHtml += '<tr style="border-bottom: 2px solid #ddd;"><th>Товар</th><th>Количество</th><th>Цена</th><th>Сумма</th></tr>';
        
        let total = 0;
        order.items.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            itemsHtml += `
                <tr style="border-bottom: 1px solid #ddd;">
                    <td style="padding: 10px;">${item.product_name}</td>
                    <td style="padding: 10px;">${item.quantity}</td>
                    <td style="padding: 10px;">${item.price} ₽</td>
                    <td style="padding: 10px;">${itemTotal} ₽</td>
                </tr>
            `;
        });
        itemsHtml += `<tr><td colspan="3" style="padding: 10px; text-align: right; font-weight: bold;">Итого: </td><td style="padding: 10px; font-weight: bold;">${total} ₽</td></tr>`;
        itemsHtml += '</table>';
        
        const orderHtml = `
            <div style="background: #f9fafb; padding: 20px; border-radius: 10px;">
                <p><strong>Номер заказа:</strong> #${order.id}</p>
                <p><strong>Статус:</strong> <span class="status-badge ${statusClass}">${statusText}</span></p>
                <p><strong>Дата заказа:</strong> ${new Date(order.created_at).toLocaleString('ru-RU')}</p>
                <p><strong>Адрес доставки:</strong> ${order.customer_address}</p>
                <p><strong>Контактные данные:</strong> ${order.customer_name}, ${order.customer_phone}, ${order.customer_email}</p>
                
                <h4 style="margin-top: 20px;">Товары в заказе:</h4>
                ${itemsHtml}
                
                <div class="timeline">
                    <h4 style="margin-bottom: 15px;">Статус доставки:</h4>
                    <div class="timeline-item ${order.status === 'pending' ? 'active' : ''}">
                        <div class="timeline-date">Шаг 1</div>
                        <div class="timeline-title">Заказ оформлен</div>
                        <div>Ваш заказ принят в обработку</div>
                    </div>
                    <div class="timeline-item ${order.status === 'confirmed' ? 'active' : ''}">
                        <div class="timeline-date">Шаг 2</div>
                        <div class="timeline-title">Заказ подтвержден</div>
                        <div>Менеджер подтвердил наличие товаров</div>
                    </div>
                    <div class="timeline-item ${order.status === 'shipped' ? 'active' : ''}">
                        <div class="timeline-date">Шаг 3</div>
                        <div class="timeline-title">Заказ отправлен</div>
                        <div>Заказ передан в службу доставки</div>
                    </div>
                    <div class="timeline-item ${order.status === 'delivered' ? 'active' : ''}">
                        <div class="timeline-date">Шаг 4</div>
                        <div class="timeline-title">Заказ доставлен</div>
                        <div>Заказ доставлен получателю</div>
                    </div>
                </div>
            </div>
        `;
        
        document.getElementById('order-details').innerHTML = orderHtml;
        document.getElementById('order-info').style.display = 'block';
        document.getElementById('no-order').style.display = 'none';
    }
</script>
{% endblock %}
